<main>
<section class="abc-bg-dots">
<div class="container contact-hero">
<div class="contact-hero__intro">
<span class="abc-eyebrow">Get in touch</span>
<h1 class="hero">How can I help?</h1>
<p class="lead">Share a few details about your team and what you're looking for, and I'll reply within one working day.</p>
</div>
<form class="contact-form" action="#" method="post">
<div class="contact-form__row"><div class="abc-field"><label class="abc-field__label" for="firstname">First name</label><input class="abc-field__input" id="firstname" type="text" autocomplete="given-name"></div><div class="abc-field"><label class="abc-field__label" for="lastname">Last name</label><input class="abc-field__input" id="lastname" type="text" autocomplete="family-name"></div></div>
<div class="contact-form__row"><div class="abc-field"><label class="abc-field__label" for="jobtitle">Job title</label><input class="abc-field__input" id="jobtitle" type="text" autocomplete="organization-title"></div><div class="abc-field"><label class="abc-field__label" for="company">Company</label><input class="abc-field__input" id="company" type="text" autocomplete="organization"></div></div>
<div class="contact-form__row"><div class="abc-field"><label class="abc-field__label" for="email">Email</label><input class="abc-field__input" id="email" type="email" autocomplete="email"></div><div class="abc-field"><label class="abc-field__label" for="phone">Phone number</label><input class="abc-field__input" id="phone" type="tel" autocomplete="tel"></div></div>
<div class="abc-field"><label class="abc-field__label" for="message">What would you like help with?</label><textarea class="abc-field__input" id="message" rows="5"></textarea></div>
<button class="abc-btn abc-btn--primary" type="submit">Submit</button>
</form>
</div>
</section>
</main>
